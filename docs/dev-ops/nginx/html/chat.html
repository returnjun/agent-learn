<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 对话与知识库管理</title>
    <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="./css/chat.css">
</head>
<body class="bg-[#f3f4f6] text-gray-800 h-screen flex overflow-hidden font-sans" data-mode="chat">

<aside class="w-64 bg-[#f0f4f9] h-full flex flex-col transition-all duration-300 hidden md:flex border-r border-gray-200 z-10">
    <div class="p-4">
        <div class="flex items-center justify-between gap-3">
            <span id="brand-title" class="font-bold text-lg text-gray-700 tracking-wide">Chat</span>
            <button id="mode-toggle" type="button" class="mode-toggle" aria-label="切换到 Agent 模式" title="切换到 Agent 模式">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3l1.8 4.7L18.5 9.5l-4.7 1.8L12 16l-1.8-4.7-4.7-1.8 4.7-1.8L12 3zm6 11l.9 2.1L21 17l-2.1.9L18 20l-.9-2.1L15 17l2.1-.9L18 14z"></path></svg>
                <span id="mode-toggle-label">Agent</span>
            </button>
        </div>
        <p id="mode-description" class="text-xs text-gray-400 mt-1">知识库增强对话</p>
    </div>

    <div class="px-3 py-2">
        <button id="new-chat-button" type="button" class="flex items-center justify-center space-x-2 w-full p-2.5 bg-white border border-gray-200 rounded-xl shadow-sm text-sm font-medium hover:bg-gray-50 hover:text-blue-600 transition-colors">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
            <span>新建对话</span>
        </button>
    </div>

    <div class="flex-1 overflow-y-auto mt-2 px-3 space-y-1" id="chat-list-container">
    </div>

    <div id="knowledge-management" class="p-3 border-t border-gray-200 space-y-2 bg-[#f0f4f9]">
        <p class="text-xs text-gray-500 font-semibold px-1 mb-2">知识库管理</p>
        <button type="button" data-modal-open="upload-modal" class="flex items-center space-x-2 w-full p-2 rounded-lg text-sm bg-blue-50 text-blue-600 hover:bg-blue-100 transition">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path></svg>
            <span>上传文件知识库</span>
        </button>
        <!-- 新增：上传 Git 知识库按钮 -->
        <button type="button" data-modal-open="git-upload-modal" class="flex items-center space-x-2 w-full p-2 rounded-lg text-sm bg-green-50 text-green-600 hover:bg-green-100 transition">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4"></path></svg>
            <span>上传Git知识库</span>
        </button>
        <button id="open-tags-button" type="button" class="flex items-center space-x-2 w-full p-2 rounded-lg text-sm bg-purple-50 text-purple-600 hover:bg-purple-100 transition">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 002-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path></svg>
            <span>查看知识库列表</span>
        </button>
    </div>
</aside>

<main class="flex-1 flex flex-col h-full bg-white relative">
    <header class="h-16 flex items-center justify-between px-4 lg:px-8 shrink-0 bg-white border-b border-gray-100">
        <div class="flex items-center gap-3 min-w-0">
            <h1 class="text-lg font-medium text-gray-700 truncate" id="current-chat-title">新的对话</h1>
            <span id="current-mode-badge" class="mode-badge">Chat</span>
        </div>
        <div class="w-8 h-8 rounded-full bg-blue-500 flex items-center justify-center text-white font-bold shadow-sm">U</div>
    </header>

    <div id="chat-container" class="flex-1 overflow-y-auto no-scrollbar pb-40 pt-8 px-4 lg:px-32 max-w-5xl mx-auto w-full">
        <div id="welcome-screen" class="flex flex-col items-center justify-center h-full mt-[-5vh]">
            <h2 id="welcome-title" class="text-4xl font-semibold mb-2 bg-clip-text text-transparent bg-gradient-to-r from-blue-500 to-purple-500">你好，我是你的 AI 助手</h2>
            <h2 id="welcome-subtitle" class="text-2xl font-medium text-gray-400 mb-8 mt-2">有什么我可以帮您的吗？</h2>
        </div>
        <div id="messages-wrapper" class="hidden flex-col space-y-8"></div>
    </div>

    <div class="absolute bottom-0 left-0 w-full bg-gradient-to-t from-white via-white to-transparent pt-12 pb-6 px-4 lg:px-32 flex justify-center">
        <div class="w-full max-w-3xl relative">

            <!-- 知识库选择 -->
            <div id="chat-tools" class="flex items-center mb-2 px-1 space-x-3 overflow-x-auto no-scrollbar pb-1">
                <div class="relative flex items-center bg-white border border-gray-200 rounded-xl pl-3 pr-8 py-1.5 shadow-sm text-sm hover:border-blue-300 transition-colors shrink-0">
                    <svg class="w-4 h-4 text-blue-500 mr-2 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 002-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path></svg>
                    <select id="rag-select" class="bg-transparent border-none outline-none text-gray-700 cursor-pointer focus:ring-0 w-44 truncate">
                        <option value="">普通对话 (不使用知识库)</option>
                    </select>
                    <div class="pointer-events-none absolute inset-y-0 right-2 flex items-center text-gray-400">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                    </div>
                </div>

                <button id="refresh-rag-button" type="button" title="刷新知识库列表" class="p-1.5 text-gray-400 hover:text-blue-600 hover:bg-blue-50 rounded-lg transition-colors shrink-0">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                </button>
            </div>

            <div id="agent-tools" class="hidden items-center mb-2 px-1 gap-3 overflow-x-auto no-scrollbar pb-1">
                <label class="agent-setting">
                    <span>智能体 ID</span>
                    <input id="agent-id-input" type="text" value="1" inputmode="numeric" aria-label="智能体 ID">
                </label>
                <label class="agent-setting">
                    <span>最大步数</span>
                    <select id="agent-max-step" aria-label="Agent 最大执行步数">
                        <option value="1">1 步</option>
                        <option value="3" selected>3 步</option>
                        <option value="5">5 步</option>
                        <option value="8">8 步</option>
                    </select>
                </label>
            </div>

            <div class="bg-gray-50 border border-gray-200 rounded-2xl p-1.5 flex items-end relative transition-shadow focus-within:shadow-md focus-within:border-blue-300">
                <textarea id="message-input" rows="1" class="w-full max-h-32 p-3 bg-transparent border-none focus:ring-0 resize-none overflow-y-auto no-scrollbar outline-none placeholder-gray-400 text-gray-800" placeholder="问问我..."></textarea>
                <button id="send-button" class="p-3 text-gray-400 hover:text-blue-500 rounded-xl shrink-0 transition-colors hidden cursor-pointer mb-0.5 mr-0.5">
                    <svg class="w-6 h-6 transform rotate-90" fill="currentColor" viewBox="0 0 20 20"><path d="M10.894 2.553a1 1 0 00-1.788 0l-7 14a1 1 0 001.169 1.409l5-1.429A1 1 0 009 15.571V11a1 1 0 112 0v4.571a1 1 0 00.725.962l5 1.428a1 1 0 001.17-1.408l-7-14z"></path></svg>
                </button>
            </div>
            <div class="text-center mt-2 text-xs text-gray-400">AI 可能会提供不准确的信息，请仔细核实。</div>
        </div>
    </div>
</main>

<!-- 文件上传 Modal -->
<div id="upload-modal" class="fixed inset-0 bg-black bg-opacity-40 z-50 hidden flex items-center justify-center backdrop-blur-sm transition-opacity">
    <div class="bg-white rounded-2xl w-full max-w-md p-6 shadow-2xl transform transition-transform">
        <div class="flex justify-between items-center mb-5">
            <h3 class="text-lg font-semibold text-gray-800">上传新知识库</h3>
            <button type="button" data-modal-close="upload-modal" class="text-gray-400 hover:text-gray-600"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg></button>
        </div>
        <form id="upload-form" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">知识库标签 (ragTag)</label>
                <input type="text" id="rag-tag-input" required placeholder="如: java-docs" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">选择文件 (支持多个)</label>
                <div class="flex items-center justify-center w-full">
                    <label class="flex flex-col items-center justify-center w-full h-32 border-2 border-gray-300 border-dashed rounded-lg cursor-pointer bg-gray-50 hover:bg-gray-100">
                        <div class="flex flex-col items-center justify-center pt-5 pb-6">
                            <svg class="w-8 h-8 mb-2 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path></svg>
                            <p class="mb-2 text-sm text-gray-500"><span class="font-semibold">点击上传</span> 或拖拽文件</p>
                        </div>
                        <input id="file-upload-input" type="file" multiple class="hidden" />
                    </label>
                </div>
                <div id="selected-files" class="text-xs text-gray-500 mt-2 truncate"></div>
            </div>
            <button type="submit" id="upload-btn" class="w-full bg-blue-600 text-white font-medium py-2.5 rounded-lg hover:bg-blue-700 transition shadow-sm mt-2">
                确认上传
            </button>
        </form>
    </div>
</div>

<!-- 新增：Git 上传 Modal -->
<div id="git-upload-modal" class="fixed inset-0 bg-black bg-opacity-40 z-50 hidden flex items-center justify-center backdrop-blur-sm transition-opacity">
    <div class="bg-white rounded-2xl w-full max-w-md p-6 shadow-2xl transform transition-transform">
        <div class="flex justify-between items-center mb-5">
            <h3 class="text-lg font-semibold text-gray-800">解析 Git 知识库</h3>
            <button type="button" data-modal-close="git-upload-modal" class="text-gray-400 hover:text-gray-600"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg></button>
        </div>
        <form id="git-upload-form" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Git 仓库地址 (URL)</label>
                <input type="text" id="git-url-input" required placeholder="例如: https://github.com/xxx/xxx.git" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-green-500 outline-none transition">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">用户名 (UserName)</label>
                <input type="text" id="git-username-input" required placeholder="输入 Git 用户名" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-green-500 outline-none transition">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">访问令牌 (Token)</label>
                <input type="password" id="git-token-input" required placeholder="输入 Personal Access Token" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-green-500 outline-none transition">
            </div>
            <button type="submit" id="git-upload-btn" class="w-full bg-green-600 text-white font-medium py-2.5 rounded-lg hover:bg-green-700 transition shadow-sm mt-2">
                开始拉取并解析
            </button>
        </form>
    </div>
</div>

<!-- 标签查看 Modal -->
<div id="tags-modal" class="fixed inset-0 bg-black bg-opacity-40 z-50 hidden flex items-center justify-center backdrop-blur-sm transition-opacity">
    <div class="bg-white rounded-2xl w-full max-w-md p-6 shadow-2xl flex flex-col max-h-[80vh]">
        <div class="flex justify-between items-center mb-4 shrink-0">
            <h3 class="text-lg font-semibold text-gray-800">已有的知识库 (Tags)</h3>
            <button type="button" data-modal-close="tags-modal" class="text-gray-400 hover:text-gray-600"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg></button>
        </div>

        <div class="flex-1 overflow-y-auto pr-2 no-scrollbar">
            <div id="tags-loading" class="text-center text-gray-400 py-4">加载中...</div>
            <div id="tags-empty" class="text-center text-gray-400 py-4 hidden">暂无知识库数据</div>
            <div id="tags-list" class="flex flex-wrap gap-2"></div>
        </div>
    </div>
</div>

<script src="./js/chat.js" defer></script>
</body>
</html>
