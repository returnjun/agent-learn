server {
    listen 80;
    server_name chat.daoha.top;

    # 1. 静态前端页面路由
    location / {
        root   /usr/share/nginx/html;
        index  chat.html index.html index.htm;
    }

    # 2. 后端接口反向代理路由
    location /api/ {
        # 转发到 my-network 中当前的后端容器，并保留完整 /api/... 路径
        proxy_pass http://agent-learn:8091;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # === 下面这三行对你的 AI 流式输出（打字机效果）至关重要 ===
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off; # 关闭缓冲，实现流式数据实时透传
        proxy_cache off;
        proxy_read_timeout 60s;
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
